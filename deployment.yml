apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-dep
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: my-dep
    spec:
      containers:
      - image: nginx
        name: nginx_countainer
        ports:
        - containerPort: 80
      - image: httpd 
        name: httpd_count
        ports:
        - containerPort: 81