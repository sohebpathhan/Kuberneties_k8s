apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-dep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-dep

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: my-dep

    spec:
      containers:
      - name: nginx-count
        image: nginx
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-service

spec:
  selector:
    app: my-dep

  ports:
  - name: nginx-port
    protocol: TCP
    port: 80
    targetPort: 80

  type: NodePort
