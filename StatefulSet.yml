apiVersion: v1
kind: Service
metadata:
  name: my-headless
spec:
  clusterIP: None
  selector:
    app: my-ss
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-statefulset-nodeport
spec:
  type: NodePort
  selector:
    app: my-ss
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-statefulset
spec:
  serviceName: my-headless
  replicas: 4
  selector:
    matchLabels:
      app: my-ss
  template:
    metadata:
      labels:
        app: my-ss
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
